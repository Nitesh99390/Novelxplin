<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel - Novelxplin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css?v=20261013c">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page">
    <div class="wrap">
      <div id="crumb" data-sk="crumb"></div>
      <div class="grid-2">
        <div style="display:flex;flex-direction:column;gap:14px">
          <section class="panel" id="head" data-sk="novelhead"></section>
          <section class="panel">
            <div class="panel-head"><h2 id="sTitle" data-sk="title"></h2></div>
            <div class="summary collapsed" id="summary" data-sk="summary"></div>
            <a href="#" class="toggle-summary" id="toggleSummary">Show more</a>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2 id="cTitle" data-sk="title"></h2>
              <div class="chapter-tools">
                <input type="text" id="chapSearch" placeholder="Find chapter...">
                <select id="chapRange"></select>
              </div>
            </div>
            <div class="chapter-list" id="chapters" data-sk="chapters:20"></div>
            <div id="chapPager"></div>
          </section>
        </div>
        <aside class="sidebar-stack">
          <section class="panel">
            <div class="panel-head"><h2 id="relTitle" data-sk="title"></h2></div>
            <div id="related" data-sk="rank:8"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 id="gTitle" data-sk="title"></h2></div>
            <div id="genres" data-sk="genres"></div>
          </section>
        </aside>
      </div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script src="/js/skeleton.js?v=20261013c"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/config.js?v=20261013c"></script>
  <script src="/js/data.js?v=20261013c"></script>
  <script src="/js/app.js?v=20261013c"></script>
  <script>
    document.addEventListener("app:ready", async () => {
      const { $, esc, q, U, stars, nCard, genreGrid, rankList, pagination, breadcrumb, I } = UI;
      const n = DB.get(q.get("n"));
      if (!n) { SK.clear(); $("#head").innerHTML = `<div class="empty">${I.search}<div>Novel not found.</div></div>`; return; }
      document.title = `${n.title} - Novelxplin`;
      const PER = 50;
      const hist = Lib.history()[n.id];
      const inLib = Lib.has(n.id);
      const views = n.views >= 1e6 ? (n.views / 1e6).toFixed(1) + "M" : n.views >= 1e3 ? Math.round(n.views / 1e3) + "K" : n.views;
      const coverHtml = n.cover ? `<a class="cover has-img${n.status === "Completed" ? " full-badge" : ""}"><img src="${esc(n.cover)}" alt="${esc(n.title)}"></a>` : `<a class="cover${n.status === "Completed" ? " full-badge" : ""}" style="background:${n.color}"><span class="glyph">${n.glyph}</span></a>`;

      $("#crumb").innerHTML = breadcrumb([{ label: "Home", href: U.home }, { label: n.genres[0], href: U.genre(n.genres[0]) }, { label: n.title }]);
      $("#head").innerHTML = `<div class="novel-head">
        ${coverHtml}
        <div>
          <h1>${esc(n.title)}${n.hot ? '<span class="badge-hot">HOT</span>' : ""}</h1>
          <div class="rate-box" id="rateBox">
            <div class="rate-top"><span id="rateStars">${stars(n.rating)}</span> <span class="rate-count" id="rateCount">${n.votes} ${n.votes === 1 ? "rating" : "ratings"}</span></div>
            <div class="rate-you">
              <span class="rate-label" id="rateLabel">Rate this novel</span>
              <span class="rate-input" id="rateInput" role="radiogroup" aria-label="Your rating">
                ${[1, 2, 3, 4, 5].map(v => `<button type="button" class="rate-star" data-v="${v}" role="radio" aria-checked="false" aria-label="${v} star${v > 1 ? "s" : ""}" title="${["Terrible", "Bad", "Okay", "Good", "Excellent"][v - 1]}">${I.star}</button>`).join("")}
              </span>
              <button type="button" class="rate-clear" id="rateClear" hidden>Remove</button>
            </div>
            <div class="rate-dist" id="rateDist" hidden></div>
          </div>
          <div class="info-row"><div class="k">${I.pen} Author</div><div class="v"><a href="${U.search(n.author || "")}">${esc(n.author || "Unknown")}</a></div></div>
          <div class="info-row"><div class="k">${I.globe} Type</div><div class="v">${esc(n.lang)}</div></div>
          <div class="info-row"><div class="k">${I.tag} Genres</div><div class="v tag-list">${n.genres.map(g => `<a href="${U.genre(g)}">${esc(g)}</a>`).join("")}</div></div>
          <div class="info-row"><div class="k">${I.check} Status</div><div class="v" style="color:${n.status === "Completed" ? "var(--green)" : "var(--accent)"};font-weight:700">${n.status}</div></div>
          <div class="info-row"><div class="k">${I.book} Chapters</div><div class="v">${n.chapters}</div></div>
          <div class="info-row"><div class="k">${I.eye} Views</div><div class="v">${views}</div></div>
          <div class="info-row"><div class="k">${I.clock} Updated</div><div class="v">${DB.timeAgo(n.updatedMinutesAgo)}${n.chapters ? ` &middot; <a href="${U.chapter(n.slug, n.chapters)}">${esc(DB.chapterTitle(n, n.chapters))}</a>` : ""}</div></div>
          <div class="btn-row">
            ${n.chapters ? `<a class="btn" href="${U.chapter(n.slug, 1)}">${I.book} Read First</a>
            <a class="btn alt" href="${U.chapter(n.slug, n.chapters)}">${I.right} Read Latest</a>` : `<span class="btn disabled">No chapters yet</span>`}
            ${hist ? `<a class="btn ghost" href="${U.chapter(n.slug, hist.chap)}">${I.clock} Continue Ch. ${hist.chap}</a>` : ""}
            <button class="btn ghost ${inLib ? "active" : ""}" id="libBtn">${I.heart} <span>${inLib ? "In Library" : "Add to Library"}</span></button>
            ${Auth.isAdmin() ? `<a class="btn ghost" href="${U.admin(n.slug)}">${I.pen} Edit / Add chapters</a>` : ""}
          </div>
        </div></div>`;
      /* ---- user rating widget ---- */
      (() => {
        const WORDS = ["", "Terrible", "Bad", "Okay", "Good", "Excellent"];
        const box = $("#rateBox"), starBtns = Array.from(box.querySelectorAll(".rate-star")), label = $("#rateLabel"), clearBtn = $("#rateClear"), distEl = $("#rateDist");
        let mine = 0, busy = false, hover = 0;
        const paint = v => starBtns.forEach(b => { const on = +b.dataset.v <= v; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(+b.dataset.v === mine)); });
        function show(s) {
          mine = s.mine || 0;
          n.rating = s.shown; n.votes = s.votes;
          $("#rateStars").innerHTML = stars(n.rating);
          $("#rateCount").textContent = `${s.votes} ${s.votes === 1 ? "rating" : "ratings"}`;
          paint(mine);
          label.textContent = mine ? `Your rating: ${mine}/5 · ${WORDS[mine]}` : (Auth.user() ? "Rate this novel" : "Sign in to rate this novel");
          clearBtn.hidden = !mine;
          if (s.dist && s.votes) {
            const max = Math.max(...s.dist, 1);
            distEl.hidden = false;
            distEl.innerHTML = [5, 4, 3, 2, 1].map(v => { const c = s.dist[v - 1]; return `<div class="rate-row"><span class="rate-n">${v}${I.star}</span><span class="rate-bar"><span style="width:${Math.round(c / max * 100)}%"></span></span><span class="rate-c">${c}</span></div>`; }).join("");
          } else { distEl.hidden = true; distEl.innerHTML = ""; }
        }
        async function submit(v) {
          if (busy) return;
          if (!Auth.user()) { openLogin(); toast("Sign in with Google to rate"); return; }
          busy = true; box.classList.add("busy");
          try { show(await DB.rate(n.slug, v)); toast(`Thanks! You rated ${v}/5`); }
          catch (e) { toast("Could not save rating: " + e.message); }
          finally { busy = false; box.classList.remove("busy"); }
        }
        starBtns.forEach(b => {
          b.addEventListener("click", () => submit(+b.dataset.v));
          b.addEventListener("mouseenter", () => { hover = +b.dataset.v; paint(hover); label.textContent = `${hover}/5 · ${WORDS[hover]}`; });
          b.addEventListener("focus", () => { hover = +b.dataset.v; paint(hover); });
        });
        const reset = () => { hover = 0; paint(mine); label.textContent = mine ? `Your rating: ${mine}/5 · ${WORDS[mine]}` : (Auth.user() ? "Rate this novel" : "Sign in to rate this novel"); };
        $("#rateInput").addEventListener("mouseleave", reset);
        $("#rateInput").addEventListener("focusout", e => { if (!$("#rateInput").contains(e.relatedTarget)) reset(); });
        $("#rateInput").addEventListener("keydown", e => {
          const cur = hover || mine || 0; let next = null;
          if (e.key === "ArrowRight" || e.key === "ArrowUp") next = Math.min(5, cur + 1);
          if (e.key === "ArrowLeft" || e.key === "ArrowDown") next = Math.max(1, cur - 1);
          if (next) { e.preventDefault(); starBtns[next - 1].focus(); }
        });
        clearBtn.addEventListener("click", async () => {
          if (busy) return; busy = true; box.classList.add("busy");
          try { show(await DB.unrate(n.slug)); toast("Your rating was removed"); }
          catch (e) { toast("Failed: " + e.message); }
          finally { busy = false; box.classList.remove("busy"); }
        });
        reset();
        DB.rating(n.slug).then(show).catch(e => console.warn("rating", e.message));
        document.addEventListener("auth:change", () => DB.rating(n.slug).then(show).catch(() => { }));
      })();

      $("#libBtn").addEventListener("click", e => {
        const added = Lib.toggle(n.id);
        e.currentTarget.classList.toggle("active", added);
        e.currentTarget.querySelector("span").textContent = added ? "In Library" : "Add to Library";
        toast(added ? "Added to your library" : "Removed from library");
      });

      $("#sTitle").innerHTML = `${I.list} Summary`;
      $("#summary").innerHTML = (n.summary.length ? n.summary.map(p => `<p>${esc(p)}</p>`).join("") : "<p>No summary yet.</p>") + `<p style="color:var(--muted);font-size:12px">You're reading <b>${esc(n.title)}</b> on Novelxplin. ${n.status === "Completed" ? "This novel is completed." : "New chapters are released regularly."}</p>`;
      $("#toggleSummary").addEventListener("click", e => { e.preventDefault(); const s = $("#summary"); s.classList.toggle("collapsed"); e.target.textContent = s.classList.contains("collapsed") ? "Show more" : "Show less"; });

      $("#cTitle").innerHTML = `${I.list} Chapters <span style="color:var(--muted);font-weight:400;font-size:12px;margin-left:4px">(${n.chapters})</span>`;
      $("#chapters").innerHTML = SK.html("chapters", 20);
      let all = [];
      try { all = await DB.chapters(n.slug); } catch (e) { $("#chapters").innerHTML = `<div class="empty" style="grid-column:1/-1">Failed to load chapters.</div>`; }
      const pages = Math.max(1, Math.ceil(all.length / PER));
      let cur = Math.min(Math.max(1, parseInt(q.get("page") || "1", 10)), pages);
      const sel = $("#chapRange");
      for (let p = 1; p <= pages; p++) { const o = document.createElement("option"); o.value = p; o.textContent = `${(p - 1) * PER + 1} - ${Math.min(p * PER, all.length)}`; if (p === cur) o.selected = true; sel.appendChild(o); }
      sel.addEventListener("change", () => { cur = +sel.value; renderChapters(""); });

      const row = ch => `<a href="${U.chapter(n.slug, ch.num)}" class="${ch.num > all.length - 3 && n.status !== "Completed" ? "new-chap" : ""}">${I.chev}<span class="t truncate">${esc(ch.title || "Chapter " + ch.num)}</span><span class="d">${esc((ch.date || "").slice(0, 10))}</span></a>`;
      function renderChapters(filter) {
        let items;
        if (filter) { const f = filter.toLowerCase(); items = all.filter(c => (c.title || "").toLowerCase().includes(f) || String(c.num) === f).slice(0, 100); }
        else items = all.slice((cur - 1) * PER, cur * PER);
        $("#chapters").innerHTML = items.length ? items.map(row).join("") : `<div class="empty" style="grid-column:1/-1">No chapters${filter ? " match" : " yet"}.</div>`;
        $("#chapPager").innerHTML = filter ? "" : pagination(cur, pages, p => `${U.novel(n.slug, p)}#chapters`);
      }
      renderChapters("");
      $("#chapSearch").addEventListener("input", e => renderChapters(e.target.value.trim()));

      $("#relTitle").innerHTML = `${I.star} You may also like`;
      $("#related").innerHTML = rankList(DB.byGenre(n.genres[0]).filter(x => x.id !== n.id).slice(0, 8));
      $("#gTitle").innerHTML = `${I.list} Genres`;
      $("#genres").innerHTML = genreGrid();
    });
  </script>
</body>
</html>
