<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novelxplin - Read Web Novels Online</title>
  <meta name="description" content="Read Novels Online & Discover Free Stories. Latest release novels, completed novels and all genres.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=20261012d">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <div class="wrap">
      <!-- Featured -->
      <section class="featured" id="featured" data-sk="featured"></section>

      <div class="grid-2">
        <div>
          <section class="panel">
            <div class="panel-head"><h2 id="lrTitle" data-sk="title"></h2><a class="more" href="list.html?sort=latest-release">See more</a></div>
            <ul class="release-list" id="latestRelease" data-sk="release:14"></ul>
          </section>
        </div>
        <aside class="sidebar-stack">
          <section class="panel">
            <div class="panel-head"><h2 id="gTitle" data-sk="title"></h2></div>
            <div id="genres" data-sk="genres"></div>
            <a class="see-more" href="list.html?sort=most-popular">See more</a>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 id="rTitle" data-sk="title"></h2><a class="more" href="list.html?sort=most-popular">See more</a></div>
            <div id="ranking" data-sk="rank:8"></div>
          </section>
        </aside>
      </div>

      <div class="grid-2" style="margin-top:14px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <section class="panel">
            <div class="panel-head"><h2 id="lnTitle" data-sk="title"></h2><a class="more" href="list.html?sort=latest-novel">See more</a></div>
            <div class="novel-grid" id="latestNovels" data-sk="grid:6"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 id="cTitle" data-sk="title"></h2><a class="more" href="list.html?sort=completed">See more</a></div>
            <div class="novel-grid" id="completed" data-sk="grid:6"></div>
          </section>
        </div>
        <aside class="sidebar-stack">
          <section class="panel">
            <div class="panel-head"><h2 id="hTitle" data-sk="title"></h2><a class="more" href="library.html">Library</a></div>
            <div id="history" data-sk="lib:3"></div>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="js/skeleton.js?v=20261012d"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js?v=20261012d"></script>
  <script src="js/data.js?v=20261012d"></script>
  <script src="js/app.js?v=20261012d"></script>
  <script>
    document.addEventListener("app:ready", () => {
      const { $, esc, cover, stars, metaLines, nCard, releaseRow, rankList, genreGrid, I } = UI;

      // Featured block: 1 big + 6 small
      const feat = DB.featured();
      if (!feat.length) { $("#featured").innerHTML = `<div class="panel" style="grid-column:1/-1"><div class="empty">${I.book}<div>No novels yet.${Auth.isAdmin() ? ' <a href="admin.html" style="color:var(--link)">Upload your first novel</a>.' : ' Check back soon!'}</div></div></div>`; }
      const big = feat[0] || { color: "#334155", glyph: "📜", slug: "", title: "", rating: 0, genres: [], lang: "", chapters: 0 };
      const bigHtml = `<div class="panel big">
        <div class="cover${big.cover ? " has-img" : ""}" style="background:${big.color}">
          ${big.cover ? `<img src="${esc(big.cover)}" alt="">` : ""}
          <a href="novel.html?n=${big.slug}" style="position:absolute;inset:0;z-index:1" aria-label="${esc(big.title)}"></a>
          <span class="glyph">${big.glyph}</span>
          <div class="big-info">
            <h3><a href="novel.html?n=${big.slug}">${esc(big.title)}</a></h3>
            ${stars(big.rating)}
            ${metaLines(big)}
          </div>
        </div></div>`;
      const small = feat.slice(1).map(n => `<div class="panel f-card">${cover(n)}<div><h3 class="truncate"><a href="novel.html?n=${n.slug}">${esc(n.title)}</a></h3>${stars(n.rating)}${metaLines(n)}</div></div>`).join("");
      if (feat.length) $("#featured").innerHTML = bigHtml + small;

      // Latest release
      $("#lrTitle").innerHTML = `${I.refresh} Latest Release Novels`;
      $("#latestRelease").innerHTML = DB.latestRelease(18).map(releaseRow).join("");

      // Genres
      $("#gTitle").innerHTML = `${I.list} Genres`;
      $("#genres").innerHTML = genreGrid();

      // Ranking
      $("#rTitle").innerHTML = `${I.star} Top Rated`;
      $("#ranking").innerHTML = rankList(DB.rankByRating(8));

      // Latest novels
      $("#lnTitle").innerHTML = `${I.book} Latest Novels`;
      $("#latestNovels").innerHTML = DB.latestNovels(6).map(n => nCard(n)).join("");

      // Completed
      $("#cTitle").innerHTML = `${I.check} Completed Novels`;
      $("#completed").innerHTML = DB.completed(6).map(n => nCard(n, { showFull: true, fullRibbon: true })).join("");

      // Reading history
      $("#hTitle").innerHTML = `${I.clock} Continue Reading`;
      const hist = Object.entries(Lib.history()).sort((a, b) => b[1].at - a[1].at).slice(0, 6);
      $("#history").innerHTML = hist.length
        ? `<ul class="lib-list">${hist.map(([id, h]) => { const n = DB.get(id); if (!n) return ""; return `<li>${cover(n)}<div><div class="t truncate"><a href="novel.html?n=${n.slug}">${esc(n.title)}</a></div><div class="s">Last read: <a href="read.html?n=${n.slug}&c=${h.chap}">Chapter ${h.chap}</a></div></div><a class="rm" href="read.html?n=${n.slug}&c=${h.chap}">${I.right}</a></li>`; }).join("")}</ul>`
        : `<div class="empty">${I.book}<div>No reading history yet.<br>Start a novel and it will show up here.</div></div>`;
    });
  </script>
</body>
</html>
