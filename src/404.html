<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Novelxplin</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page">
    <div class="wrap">
      <div id="crumb" data-sk="crumb"></div>
      <div class="grid-2">
        <div>
          <section class="panel">
            <div class="panel-head"><h2 id="title"></h2></div>
            <div class="empty" id="msg">
              <div class="icon">404</div>
              <div><strong>We couldn't find that page.</strong><br>The link may be broken, or the novel / chapter may have been removed.</div>
              <div class="btn-row" style="justify-content:center;margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
                <a class="btn" href="/">Go home</a>
                <a class="btn alt" href="/latest-novels">Browse novels</a>
                <a class="btn ghost" href="/search">Search</a>
              </div>
            </div>
          </section>
          <section class="panel" style="margin-top:14px">
            <div class="panel-head"><h2 id="pTitle" data-sk="title"></h2><a class="more" href="/most-popular">See more</a></div>
            <div class="novel-grid" id="popular" data-sk="grid:6"></div>
          </section>
        </div>
        <aside class="sidebar-stack">
          <section class="panel">
            <div class="panel-head"><h2 id="gTitle" data-sk="title"></h2></div>
            <div id="genres" data-sk="genres"></div>
          </section>
        </aside>
      </div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script type="module" src="/js/pages/404.js"></script>
</body>
</html>
