<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read - Novelxplin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="reader-page">
  <div class="read-progress" id="readProgress" aria-hidden="true"></div>
  <div id="siteHeader"></div>
  <div class="reader-top"><div class="wrap">
    <a href="/" title="Home"></a>
    <span class="novel-title truncate" id="rtTitle" data-sk="title"></span>
    <span class="rt-pct" id="rtPct" title="Reading progress">0%</span>
    <span class="rt-tools" id="rtTools"></span>
    <a class="btn ghost" href="#" id="rtLib"></a>
    <button class="btn ghost icon-btn" id="rtSettings" title="Reader settings" aria-label="Reader settings" aria-expanded="false"></button>
    <div class="reader-settings" id="settings" role="dialog" aria-label="Reader settings" hidden>
      <div class="rs-head"><strong>Reader settings</strong><button type="button" class="rs-close" id="rsClose" aria-label="Close">&times;</button></div>
      <div class="grp"><label>Theme</label>
        <button data-theme="paper" title="Paper"><span class="sw" style="background:#f4f1ea;border-color:#ccc"></span></button>
        <button data-theme="light" title="Light"><span class="sw" style="background:#fff;border-color:#ccc"></span></button>
        <button data-theme="sepia" title="Sepia"><span class="sw" style="background:#e9dcc4"></span></button>
        <button data-theme="green" title="Eye-care green"><span class="sw" style="background:#cfe3c4"></span></button>
        <button data-theme="dark" title="Dark"><span class="sw" style="background:#1c1c1c"></span></button>
        <button data-theme="night" title="Night blue"><span class="sw" style="background:#0b1220"></span></button>
        <button data-theme="oled" title="AMOLED black"><span class="sw" style="background:#000"></span></button>
      </div>
      <div class="grp"><label>Font size</label><button data-size="-1">A-</button><button id="sizeLabel" disabled></button><button data-size="1">A+</button></div>
      <div class="grp"><label>Font</label><button data-font="serif">Serif</button><button data-font="sans">Sans</button><button data-font="merri">Merriweather</button><button data-font="lora">Lora</button><button data-font="dys">Dyslexic</button></div>
      <div class="grp"><label>Line height</label><button data-lh="1.5">1.5</button><button data-lh="1.6">1.6</button><button data-lh="1.8">1.8</button><button data-lh="2.1">2.1</button></div>
      <div class="grp"><label>Paragraph</label><button data-pspace="0.6">Tight</button><button data-pspace="1.1">Normal</button><button data-pspace="1.7">Loose</button></div>
      <div class="grp"><label>Width</label><button data-width="-100">&minus;</button><button id="widthLabel" disabled></button><button data-width="100">+</button></div>
      <div class="grp"><label>Align</label><button data-align="left">Left</button><button data-align="justify">Justify</button></div>
      <div class="grp rs-foot"><button id="rsReset">Reset to defaults</button><span class="kb-hint">Keys: ← → chapters · F focus · S auto-scroll · L listen (Space pause · [ ] paragraph · , . speed) · T theme · +/- size</span></div>
    </div>
  </div></div>

  <div class="float-bar" id="autoBar" hidden>
    <span>Auto-scroll</span><button data-as="-1">&minus;</button><b id="asVal">2</b><button data-as="1">+</button><button id="asStop" class="stop">Stop</button>
  </div>
  <!-- Listen player -->
  <div class="tts-player" id="ttsBar" role="region" aria-label="Listen player" hidden>
    <div class="tp-head">
      <span class="tp-live"><i></i>Listening</span>
      <span class="tp-chap truncate" id="ttsChap" title="Current chapter"></span>
      <span class="tp-pos" id="ttsStatus">–</span>
      <button class="tp-x" id="ttsStop" title="Stop listening" aria-label="Stop">&times;</button>
    </div>
    <div class="tp-track" role="slider" aria-label="Jump to paragraph" title="Tap to jump"><i id="ttsTrack"></i></div>
    <button class="tp-follow" id="ttsFollow" hidden><svg class="icon" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg> Back to now playing</button>
    <div class="tp-main">
      <button class="tp-chip" id="ttsVoiceBtn" title="Change voice">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        <span id="ttsVoiceName">Voice</span>
      </button>
      <div class="tp-ctl">
        <button id="ttsPrev" title="Previous paragraph" aria-label="Previous paragraph"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button id="ttsPause" class="tp-play" aria-label="Pause"><svg class="icon i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg><svg class="icon i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="ttsNext" title="Next paragraph" aria-label="Next paragraph"><svg class="icon" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <button class="tp-chip" id="ttsRateBtn" title="Playback speed"><b id="ttsRateVal">1x</b></button>
    </div>
  </div>

  <!-- Voice picker sheet -->
  <div class="tts-sheet" id="ttsSheet" hidden>
    <div class="ts-card" role="dialog" aria-label="Voice settings">
      <div class="ts-grab"></div>
      <div class="ts-head"><strong>Voice &amp; speed</strong><button class="ts-close" id="tsClose" aria-label="Close">&times;</button></div>
      <div class="ts-tabs" id="tsTabs">
        <button data-lang="auto">Auto <small>best</small></button>
        <button data-lang="hi-IN">हिन्दी</button>
        <button data-lang="en-IN">English · IN</button>
        <button data-lang="en-US">English · US</button>
        <button data-lang="en-GB">UK</button>
      </div>
      <p class="ts-note" id="tsNote"></p>
      <div class="ts-row">
        <label>Voice</label>
        <div class="ts-chips" id="tsGender">
          <button data-g="">Any</button><button data-g="♀">♀ Female</button><button data-g="♂">♂ Male</button>
        </div>
      </div>
      <div class="ts-search"><input type="search" id="tsFind" placeholder="Search voice or language…" aria-label="Search voices" autocomplete="off"></div>
      <div class="ts-list" id="tsList"></div>
      <div class="ts-row">
        <label>Speed</label>
        <input type="range" id="tsRate" min="0.5" max="2" step="0.1" aria-label="Speed">
        <b id="tsRateVal">1x</b>
      </div>
      <div class="ts-row" id="tsPitchRow">
        <label>Pitch</label>
        <input type="range" id="tsPitch" min="-50" max="50" step="5" aria-label="Pitch">
        <b id="tsPitchVal">0%</b>
      </div>
      <div class="ts-row">
        <label>Sleep timer</label>
        <div class="ts-chips" id="tsSleep">
          <button data-sleep="0">Off</button><button data-sleep="15">15m</button><button data-sleep="30">30m</button><button data-sleep="60">60m</button><button data-sleep="chapter">Chapter end</button>
        </div>
      </div>
    </div>
  </div>

  <main class="reader-wrap">
    <div class="reader-nav" id="navTop" data-sk="nav"></div>

    <article class="chapter-content" id="content" data-sk="reader:4"></article>

    <div class="reader-nav" id="navBottom" data-sk="nav"></div>

    <section class="comment-box">
      <h3>Comments</h3>
      <textarea placeholder="Share your thoughts about this chapter..." id="cText"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" id="cPost">Post comment</button></div>
      <div id="comments" data-sk="text:2"></div>
    </section>
  </main>

  <div id="siteFooter"></div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script type="module" src="/js/pages/read.js"></script>
</body>
</html>
